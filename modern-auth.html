<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Forms</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #EFF6FF 0%, #E0E7FF 100%);
        }

        .blob1 {
            position: absolute;
            top: -120px;
            right: -80px;
            width: 320px;
            height: 320px;
            border-radius: 9999px;
            background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(99,102,241,0.3));
            filter: blur(50px);
            pointer-events: none;
        }

        .blob2 {
            position: absolute;
            bottom: -120px;
            left: -80px;
            width: 320px;
            height: 320px;
            border-radius: 9999px;
            background: linear-gradient(135deg, rgba(244,114,182,0.25), rgba(167,139,250,0.25));
            filter: blur(55px);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .logo-box {
            height: 64px;
            width: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563EB 0%, #4F46E5 100%);
            box-shadow: 0 10px 25px rgba(59,130,246,0.4);
            border: 4px solid rgba(255,255,255,0.65);
            margin-bottom: 16px;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #4B5563;
            margin-bottom: 20px;
        }

        .form-card {
            position: relative;
            border-radius: 16px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: saturate(180%) blur(10px);
            -webkit-backdrop-filter: saturate(180%) blur(10px);
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            background: rgba(255,255,255,0.9);
            color: #111827;
            font-size: 14px;
            outline: none;
            transition: box-shadow .15s ease, border-color .15s ease;
        }

        .input:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
        }

        .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
            pointer-events: none;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9CA3AF;
            cursor: pointer;
            padding: 4px;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-wrapper input {
            width: auto;
        }

        .link-button {
            background: none;
            border: none;
            color: #1D4ED8;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .btn-primary {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            color: #FFFFFF;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            background: linear-gradient(90deg, #2563EB 0%, #4F46E5 100%);
            box-shadow: 0 12px 20px rgba(37,99,235,0.3);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 15px 25px rgba(37,99,235,0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-footer {
            margin-top: 24px;
            text-align: center;
            color: #6B7280;
            font-size: 14px;
        }

        .form-footer a {
            color: #1D4ED8;
            text-decoration: none;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-options {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="blob1"></div>
    <div class="blob2"></div>
    
    <div class="container">
        <!-- Login Form -->
        <div id="loginForm">
            <div class="logo-box">
                <svg width="28" height="28" fill="white" viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                    <polyline points="9,22 9,12 15,12 15,22"/>
                </svg>
            </div>
            <h1 class="title">Welcome Back</h1>
            <p class="subtitle">Sign in to your account</p>
            
            <div class="form-card">
                <form id="loginFormElement">
                    <div class="form-group">
                        <label class="label">Email address</label>
                        <div class="input-wrapper">
                            <div class="icon">
                                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                    <polyline points="22,6 12,13 2,6"/>
                                </svg>
                            </div>
                            <input type="email" class="input" placeholder="you@example.com" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="label">Password</label>
                        <div class="input-wrapper">
                            <div class="icon">
                                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </div>
                            <input type="password" class="input" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword(this)">
                                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-options">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <button type="button" class="link-button">Forgot password?</button>
                    </div>
                    
                    <button type="submit" class="btn-primary">Sign In</button>
                </form>
                
                <div class="form-footer">
                    <p>Don't have an account? <a href="#" onclick="toggleForm()">Sign Up</a></p>
                </div>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="signupForm" class="hidden">
            <div class="logo-box">
                <svg width="28" height="28" fill="white" viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                    <polyline points="9,22 9,12 15,12 15,22"/>
                </svg>
            </div>
            <h1 class="title">Create Account</h1>
            <p class="subtitle">Join us today</p>
            
            <div class="form-card">
                <form id="signupFormElement">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="label">First Name</label>
                            <div class="input-wrapper">
                                <div class="icon">
                                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                        <circle cx="12" cy="7" r="4"/>
                                    </svg>
                                </div>
                                <input type="text" class="input" placeholder="First name" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="label">Last Name</label>
                            <div class="input-wrapper">
                                <div class="icon">
                                    <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                        <circle cx="12" cy="7" r="4"/>
                                    </svg>
                                </div>
                                <input type="text" class="input" placeholder="Last name" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="label">Email address</label>
                        <div class="input-wrapper">
                            <div class="icon">
                                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                    <polyline points="22,6 12,13 2,6"/>
                                </svg>
                            </div>
                            <input type="email" class="input" placeholder="you@example.com" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="label">Phone Number</label>
                        <div class="input-wrapper">
                            <div class="icon">
                                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
                                </svg>
                            </div>
                            <input type="tel" class="input" placeholder="+1 (555) 123-4567" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="label">Password</label>
                        <div class="input-wrapper">
                            <div class="icon">
                                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </div>
                            <input type="password" class="input" placeholder="Create password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword(this)">
                                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="label">Confirm Password</label>
                        <div class="input-wrapper">
                            <div class="icon">
                                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </div>
                            <input type="password" class="input" placeholder="Confirm password" required>
                        </div>
                    </div>
                    
                    <div class="form-options">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="terms" required>
                            <label for="terms">I agree to the Terms & Privacy Policy</label>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-primary">Create Account</button>
                </form>
                
                <div class="form-footer">
                    <p>Already have an account? <a href="#" onclick="toggleForm()">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleForm() {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            
            loginForm.classList.toggle('hidden');
            signupForm.classList.toggle('hidden');
        }

        function togglePassword(button) {
            const input = button.previousElementSibling;
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            
            const eyeIcon = button.querySelector('svg');
            if (type === 'text') {
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
            } else {
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
            }
        }

        document.getElementById('loginFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            const button = this.querySelector('.btn-primary');
            button.disabled = true;
            button.innerHTML = 'Signing In...';
            
            setTimeout(() => {
                alert('Login successful!');
                button.disabled = false;
                button.innerHTML = 'Sign In';
            }, 2000);
        });

        document.getElementById('signupFormElement').addEventListener('submit', function(e) {
            e.preventDefault();
            const button = this.querySelector('.btn-primary');
            button.disabled = true;
            button.innerHTML = 'Creating Account...';
            
            setTimeout(() => {
                alert('Account created successfully!');
                button.disabled = false;
                button.innerHTML = 'Create Account';
            }, 2000);
        });
    </script>
</body>
</html>
